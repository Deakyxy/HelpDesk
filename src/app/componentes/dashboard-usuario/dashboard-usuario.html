<nav class="navbar bg-body-tertiary shadow border-0">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold">Bienvenido, {{ usuario.nombres }} {{ usuario.apellidos }}</a>
    <div><button class="btn btn-danger" (click)="cerrarSesion()">Cerrar Sesión</button></div>
  </div>
</nav>

<div class="container mt-4 shadow border-0 p-4" style="border-radius: 20px; background-color: #f8f9fa;">
  
  <div class="d-flex flex-column flex-sm-row justify-content-between gap-3">
    <button class="btn btn-info text-white custom-btn fw-semibold">
      Ver mis solicitudes
    </button>
    <button type="button" class="btn btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevoTicket">
      Crear nueva solicitud
    </button>
  </div>
</div>

<div class="modal fade" id="modalNuevoTicket" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border: 2px solid #0d6efd; border-radius: 15px; overflow: hidden;">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-bold" id="tituloModal">Detalles del Problema</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body p-4">
        
        <div class="mb-3">
          <label class="form-label fw-semibold text-primary">Título del Problema</label>
          <input type="text" class="form-control" [(ngModel)]="nuevoTicket.titulo" placeholder="Ej. PC no da video">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-primary">Área</label>
          <input type="text" class="form-control" [(ngModel)]="nuevoTicket.area" placeholder="Ej. Sistemas, Finanzas...">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-primary">Comentario / Detalles</label>
          <textarea class="form-control" rows="3" [(ngModel)]="nuevoTicket.comentario" placeholder="Describe qué pasó..."></textarea>
        </div>

      </div>
      <div class="modal-footer bg-light">
        <!-- Botón para cancelar -->
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        
        <!-- ESTE es el botón que realmente ejecuta tu función y de paso cierra el modal -->
        <button type="button" class="btn btn-primary fw-bold" (click)="crearTicket()" data-bs-dismiss="modal">
          Enviar a Soporte
        </button>
      </div>

    </div>
  </div>
</div>
