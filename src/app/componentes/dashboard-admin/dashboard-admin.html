<nav class="navbar bg-body-tertiary shadow border-0">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold">Bienvenido Admin</a>
    <div><button class="btn btn-danger" (click)="cerrarSesion()">Cerrar Sesión</button></div>
  </div>
  
</nav>

<div class="container mt-5">
  <div class="card shadow" style="border: 2px solid #0d6efd; border-radius: 15px; overflow: hidden;">
    <div class="card-body p-0">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-white text-center">
          <tr style="color: #0d6efd; font-size: 1.1em;">
            <th class="py-3">Título del Problema</th>
            <th class="py-3">Comentario / Detalles</th>
            <th class="py-3">Área</th>
            <th class="py-3">Elegir Técnico</th>
            <th class="py-3">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ticket of ticketsPendientes" class="text-center">
            <td class="text-start fw-semibold">{{ ticket.titulo }}</td>
            <td class="text-start text-muted">{{ ticket.comentario }}</td>
            <td>{{ ticket.area }}</td>
            <td>
              <select #selectTecnico class="form-select">
                <option value="">-- Seleccionar --</option>
                <option *ngFor="let tecnico of tecnicos" [value]="tecnico.id">
                  {{ tecnico.nombres }} {{ tecnico.apellidos }}
                </option>
              </select>
            </td>
            <td>
              <button class="btn btn-primary" (click)="asignar(ticket.id, selectTecnico.value)">
                Asignar Ticket
              </button>
            </td>
          </tr>
          <tr *ngIf="ticketsPendientes.length === 0">
            <td colspan="5" class="text-center py-4 text-muted">
              No hay tickets pendientes en este momento.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
